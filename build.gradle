plugins {
    id 'java'
    id 'org.springframework.boot' version '2.7.18'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
    id "io.freefair.lombok" version "8.10"
}

group = 'tj.railway'
version = '1.0'

// На рабочем сервере (198.1.2.246) — jdk1.8.0_65. Не новее: старый SQL Server
// там говорит только TLS 1.0, а Java 8u291+ его отключила (тот же урок, что у
// Backend-Auth и AsoupServer). Поэтому байт-код Java 8.
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Проверка токена Backend-Auth (HS512) — та же версия, что в AsoupServer.
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // Закреплён: 8.4.1 проверен с TLS 1.0 к SQL Server на .246 под Java 8u65
    // (AsoupServer работает с той же базой тем же драйвером). Spring Boot 2.7
    // по умолчанию принёс бы 10.x — не поднимать.
    runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc:8.4.1.jre8'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
    // Архив сообщений для ArchiveRoundTripTest: -Dmesplan.archive=<папка> (без него тест пропускается).
    // Пустое значение передавать нельзя: Paths.get("") — текущая папка, и тест обошёл бы весь проект.
    if (System.getProperty('mesplan.archive')) {
        systemProperty 'mesplan.archive', System.getProperty('mesplan.archive')
    }
    // Пары «входящая строка — ответ старой программы — квитанция сети» для ArchiveAnswerRulesTest.
    if (System.getProperty('mesplan.answers')) {
        systemProperty 'mesplan.answers', System.getProperty('mesplan.answers')
    }
    testLogging { showStandardStreams = true }
}

// Один исполняемый JAR без «-plain» — его и кладут на сервер.
jar {
    enabled = false
}
bootJar {
    archiveFileName = 'mesplan.jar'
}
