# Mesplan — сервис заявок МЕСПЛАН (:8687).
#
# Файл в git и БЕЗ паролей. Пароль базы — из переменной среды MESPLAN_DB_PASSWORD;
# не задан — служба не стартует (RequiredSecrets). На сервере переменные задаются
# в xml обёртки WinSW: <env name="MESPLAN_DB_PASSWORD" value="..."/>.
#
# HTTPS здесь не включается: в исходнике стояло server.ssl.enabled=true без
# хранилища ключей, и служба падала при запуске («Could not load key store 'null'»).
# Фронт и остальные службы ходят по http.

server.port=8687

spring.datasource.url=jdbc:sqlserver://198.1.2.246:1433;databaseName=mesplan;instance=SQL Server;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=${MESPLAN_DB_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2005Dialect
spring.jpa.properties.hibernate.proc.param_null_passing=true
# Схема рабочей базы не трогается никогда.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Тексты запросов в журнал не пишутся (было true — журнал рос на каждом запросе).
spring.jpa.show-sql=false

# Загрузка файла заявок: файлы маленькие, 2 МБ с запасом.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Проверка токена Backend-Auth: off | log | enforce (MesplanAuth).
mesplan.auth.mode=${MESPLAN_AUTH_MODE:off}

# Исходные файлы заявок — из них собирается ответный файл (OriginalFiles).
# По умолчанию «files» в рабочей папке службы (WinSW — папка службы).
mesplan.files.dir=${MESPLAN_FILES_DIR:files}
# Сдвиг времени в имени ответного файла, часов (как в старой программе — 1).
mesplan.answer.hour-shift=1
